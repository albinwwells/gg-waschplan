<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Waschmaschine Graue Gasse 12</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f4f4;
      color: #222;
    }

    .container {
      max-width: 600px;
      margin: 0 auto;
      padding: 20px;
    }

    .header {
      text-align: center;
      margin-bottom: 25px;
    }

    .header .icon {
      font-size: 50px;
    }

    .header h1 {
      margin: 8px 0 5px;
      font-size: 28px;
    }

    .header p {
      margin: 0;
      color: #666;
    }

    .card {
      background: white;
      border-radius: 16px;
      padding: 25px;
      box-shadow: 0 3px 15px rgba(0,0,0,0.08);
      margin-bottom: 20px;
    }

    .status {
      text-align: center;
      font-size: 38px;
      font-weight: bold;
      margin: 10px 0 20px;
    }

    .free {
      color: #218739;
    }

    .busy {
      color: #c62828;
    }

    .info {
      text-align: center;
      margin-bottom: 20px;
      font-size: 17px;
      line-height: 1.6;
    }

    .countdown {
      text-align: center;
      font-size: 30px;
      font-weight: bold;
      margin: 15px 0 25px;
    }

    button {
      width: 100%;
      border: none;
      border-radius: 10px;
      padding: 14px;
      font-size: 17px;
      cursor: pointer;
      background: #222;
      color: white;
    }

    button:hover {
      opacity: 0.9;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .finish-button {
      background: #c62828;
    }

    .tabs {
      display: flex;
      justify-content: center;
      gap: 6px;
      margin-bottom: 18px;
    }

    .tab {
      width: auto;
      padding: 8px 14px;
      font-size: 14px;
      border-radius: 8px;
      background: #e5e5e5;
      color: #444;
    }

    .tab.active {
      background: #222;
      color: white;
    }

    .tab-content {
      display: none;
    }

    .tab-content.active {
      display: block;
    }

    .duration-options {
      display: flex;
      gap: 8px;
      margin-bottom: 15px;
    }

    .duration-option {
      flex: 1;
      padding: 12px 5px;
      background: #e5e5e5;
      color: #222;
      border-radius: 9px;
      font-size: 16px;
    }

    .duration-option.active {
      background: #222;
      color: white;
    }

    .custom-duration {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 15px;
    }

    .custom-duration input {
      flex: 1;
      margin-bottom: 0;
    }

    .custom-duration span {
      white-space: nowrap;
      color: #555;
    }

    label {
      display: block;
      font-weight: bold;
      margin-bottom: 6px;
    }

    input {
      width: 100%;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
      margin-bottom: 15px;
    }

    .preview {
      background: #f1f1f1;
      border-radius: 10px;
      padding: 12px;
      text-align: center;
      margin-bottom: 15px;
      color: #444;
      line-height: 1.5;
    }

    .error {
      color: #c62828;
      text-align: center;
      margin-top: 12px;
      font-weight: bold;
    }

    .loading {
      text-align: center;
      color: #666;
    }
  </style>
</head>

<body>

<div class="container">

  <div class="header">
    <div class="icon">🧺</div>
    <h1>Waschmaschine Graue Gasse 12</h1>
    <p>Washing machine status</p>
  </div>

  <div id="app" class="card">
    <div class="loading">LOADING<br>Checking the washing machine...</div>
  </div>

</div>

<script>
  const SUPABASE_URL = "https://qhqpclogoqrjugqzoubc.supabase.co";
  const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_ogf6g9WUClTrW06kaEX_Uw_smD5Dr3u";

  const { createClient } = supabase;
  const db = createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);

  const app = document.getElementById("app");

  let selectedDuration = 60;
  let customDuration = false;
  let countdownInterval = null;

  function formatDate(date) {
    return date.toLocaleString("de-CH", {
      day: "2-digit",
      month: "2-digit",
      hour: "2-digit",
      minute: "2-digit"
    });
  }

  function formatCountdown(milliseconds) {
    if (milliseconds <= 0) {
      return "00:00:00";
    }

    const totalSeconds = Math.floor(milliseconds / 1000);
    const hours = Math.floor(totalSeconds / 3600);
    const minutes = Math.floor((totalSeconds % 3600) / 60);
    const seconds = totalSeconds % 60;

    return [
      String(hours).padStart(2, "0"),
      String(minutes).padStart(2, "0"),
      String(seconds).padStart(2, "0")
    ].join(":");
  }

  async function loadMachine() {
    try {
      const { data, error } = await db.rpc("get_machine_status");

      if (error) throw error;

      const machine = data[0];

      if (
        machine &&
        machine.end_time &&
        new Date(machine.end_time).getTime() > Date.now()
      ) {
        showBusy(machine);
      } else {
        showFree();
      }

    } catch (error) {
      console.error(error);

      app.innerHTML = `
        <div class="error">
          Could not load the washing machine status.<br>
          Please try again.
        </div>
      `;
    }
  }

  function showBusy(machine) {
    if (countdownInterval) {
      clearInterval(countdownInterval);
    }

    const start = new Date(machine.start_time);
    const end = new Date(machine.end_time);

    app.innerHTML = `
      <div class="status busy">
        BUSY<br>
        <span style="font-size:22px;">BELEGT</span>
      </div>

      <div class="info">
        <strong>Anfang / Start</strong><br>
        ${formatDate(start)}
        <br><br>

        <strong>Ende / Finish</strong><br>
        ${formatDate(end)}
      </div>

      <div class="countdown" id="countdown">
        ${formatCountdown(end - Date.now())}
      </div>

      <button class="finish-button" id="finishButton">
        Ich bin fertig – Waschmaschine ist frei<br>
        I'm done – washing machine is free
      </button>
    `;

    document.getElementById("finishButton").addEventListener("click", finishWash);

    countdownInterval = setInterval(() => {
      const remaining = end.getTime() - Date.now();

      if (remaining <= 0) {
        clearInterval(countdownInterval);
        loadMachine();
      } else {
        const countdown = document.getElementById("countdown");
        if (countdown) {
          countdown.textContent = formatCountdown(remaining);
        }
      }
    }, 1000);
  }

  function showFree() {
    if (countdownInterval) {
      clearInterval(countdownInterval);
      countdownInterval = null;
    }

    app.innerHTML = `
      <div class="status free">
        FREE<br>
        <span style="font-size:22px;">FREI</span>
      </div>

      <div class="tabs">
        <button class="tab active" id="durationTab">
          Duration
        </button>

        <button class="tab" id="exactTab">
          Start & End
        </button>
      </div>

      <div id="durationContent" class="tab-content active">

        <div class="duration-options">
          <button class="duration-option" data-duration="40">40 min</button>
          <button class="duration-option active" data-duration="60">60 min</button>
          <button class="duration-option" data-duration="90">90 min</button>
        </div>

        <div class="custom-duration">
          <input
            type="number"
            id="customMinutes"
            min="1"
            max="1440"
            placeholder="Custom"
          >
          <span>minutes</span>
        </div>

        <div class="preview" id="durationPreview">
          Starts now / Jetzt starten<br>
          <strong id="durationEndPreview"></strong>
        </div>

        <button id="startDurationButton">
          Waschen beginnen – Start washing
        </button>

      </div>

      <div id="exactContent" class="tab-content">

        <label for="startTime">
          Start / Anfang
        </label>

        <input type="datetime-local" id="startTime">

        <label for="endTime">
          End / Ende
        </label>

        <input type="datetime-local" id="endTime">

        <button id="startExactButton">
          Waschen beginnen – Start washing
        </button>

      </div>

      <div id="errorMessage" class="error"></div>
    `;

    setupFreeControls();
    updateDurationPreview();
  }

  function setupFreeControls() {
    const durationTab = document.getElementById("durationTab");
    const exactTab = document.getElementById("exactTab");

    const durationContent = document.getElementById("durationContent");
    const exactContent = document.getElementById("exactContent");

    durationTab.addEventListener("click", () => {
      durationTab.classList.add("active");
      exactTab.classList.remove("active");

      durationContent.classList.add("active");
      exactContent.classList.remove("active");
    });

    exactTab.addEventListener("click", () => {
      exactTab.classList.add("active");
      durationTab.classList.remove("active");

      exactContent.classList.add("active");
      durationContent.classList.remove("active");

      setDefaultExactTimes();
    });

    document.querySelectorAll(".duration-option").forEach(button => {
      button.addEventListener("click", () => {
        selectedDuration = Number(button.dataset.duration);
        customDuration = false;

        document.querySelectorAll(".duration-option").forEach(b => {
          b.classList.remove("active");
        });

        button.classList.add("active");

        document.getElementById("customMinutes").value = "";

        updateDurationPreview();
      });
    });

    document.getElementById("customMinutes").addEventListener("input", () => {
      const value = Number(document.getElementById("customMinutes").value);

      if (value > 0) {
        customDuration = true;

        document.querySelectorAll(".duration-option").forEach(b => {
          b.classList.remove("active");
        });

        selectedDuration = value;
      } else {
        customDuration = false;
        selectedDuration = 60;

        document.querySelector('[data-duration="60"]').classList.add("active");
      }

      updateDurationPreview();
    });

    document.getElementById("startDurationButton")
      .addEventListener("click", startDurationWash);

    document.getElementById("startExactButton")
      .addEventListener("click", startExactWash);
  }

  function updateDurationPreview() {
    const now = new Date();
    const end = new Date(
      now.getTime() + selectedDuration * 60 * 1000
    );

    document.getElementById("durationEndPreview").textContent =
      `Ends / Ende: ${formatDate(end)} (${selectedDuration} min)`;
  }

  function setDefaultExactTimes() {
    const now = new Date();
    const end = new Date(now.getTime() + 60 * 60 * 1000);

    document.getElementById("startTime").value =
      toDatetimeLocal(now);

    document.getElementById("endTime").value =
      toDatetimeLocal(end);
  }

  function toDatetimeLocal(date) {
    const year = date.getFullYear();
    const month = String(date.getMonth() + 1).padStart(2, "0");
    const day = String(date.getDate()).padStart(2, "0");
    const hours = String(date.getHours()).padStart(2, "0");
    const minutes = String(date.getMinutes()).padStart(2, "0");

    return `${year}-${month}-${day}T${hours}:${minutes}`;
  }

  async function startDurationWash() {
    const errorMessage = document.getElementById("errorMessage");
    errorMessage.textContent = "";

    const minutes = Number(
      customDuration
        ? document.getElementById("customMinutes").value
        : selectedDuration
    );

    if (!minutes || minutes <= 0 || minutes > 1440) {
      errorMessage.textContent =
        "Please enter a duration between 1 and 1440 minutes.";
      return;
    }

    const start = new Date();
    const end = new Date(
      start.getTime() + minutes * 60 * 1000
    );

    await saveWash(start, end);
  }

  async function startExactWash() {
    const errorMessage = document.getElementById("errorMessage");
    errorMessage.textContent = "";

    const startValue = document.getElementById("startTime").value;
    const endValue = document.getElementById("endTime").value;

    if (!startValue || !endValue) {
      errorMessage.textContent =
        "Please enter both start and finish times.";
      return;
    }

    const start = new Date(startValue);
    const end = new Date(endValue);

    await saveWash(start, end);
  }

  async function saveWash(start, end) {
    const errorMessage = document.getElementById("errorMessage");

    if (end <= start) {
      errorMessage.textContent =
        "Finish time must be after start time.";
      return;
    }

    if (start < new Date(Date.now() - 10 * 60 * 1000)) {
      errorMessage.textContent =
        "Start time is too far in the past.";
      return;
    }

    if (end > new Date(Date.now() + 24 * 60 * 60 * 1000)) {
      errorMessage.textContent =
        "Finish time cannot be more than 24 hours from now.";
      return;
    }

    const button = document.querySelector(
      "#startDurationButton, #startExactButton"
    );

    if (button) {
      button.disabled = true;
    }

    const { error } = await db.rpc("start_wash", {
      p_start_time: start.toISOString(),
      p_end_time: end.toISOString()
    });

    if (error) {
      console.error(error);

      errorMessage.textContent =
        error.message || "Could not start the washing machine.";

      if (button) {
        button.disabled = false;
      }

      return;
    }

    loadMachine();
  }

  async function finishWash() {
    const button = document.getElementById("finishButton");

    if (button) {
      button.disabled = true;
    }

    const { error } = await db.rpc("finish_wash");

    if (error) {
      console.error(error);

      if (button) {
        button.disabled = false;
      }

      alert("Could not finish the wash. Please try again.");
      return;
    }

    loadMachine();
  }

  loadMachine();

  // Refresh status every 30 seconds
  setInterval(loadMachine, 30000);
</script>

</body>
</html>
