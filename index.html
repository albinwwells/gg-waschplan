<!DOCTYPE html>

<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Waschmaschine Graue Gasse 12</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f4f4;
      color: #222;
    }

    .container {
      max-width: 600px;
      margin: 0 auto;
      padding: 20px;
    }

    .header {
      text-align: center;
      margin-bottom: 25px;
    }

    .header .icon {
      font-size: 50px;
    }

    .header h1 {
      margin: 8px 0 5px;
      font-size: 28px;
    }

    .header p {
      margin: 0;
      color: #666;
    }

    .card {
      background: white;
      border-radius: 16px;
      padding: 25px;
      box-shadow: 0 3px 15px rgba(0,0,0,0.08);
      margin-bottom: 20px;
    }

    .status {
      text-align: center;
      font-size: 38px;
      font-weight: bold;
      margin: 10px 0 20px;
    }
    
    .free {
      color: #218739;
    }
    
    .busy {
      color: #c62828;
    }

    .info {
      margin-bottom: 20px;
      font-size: 17px;
      line-height: 1.8;
    }
    
    .info-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    
    .info-label {
      font-weight: bold;
    }
    
    .info-time {
      text-align: right;
    }

    .countdown {
      text-align: center;
      font-size: 30px;
      font-weight: bold;
      margin: 15px 0 25px;
    }

    button {
      width: 100%;
      border: none;
      border-radius: 10px;
      padding: 14px;
      font-size: 17px;
      cursor: pointer;
      background: #222;
      color: white;
    }

    button:hover {
      opacity: 0.9;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .finish-button {
      background: #c62828;
    }

    .tabs {
      display: flex;
      justify-content: center;
      gap: 6px;
      margin-bottom: 18px;
    }

    .tab {
      width: auto;
      padding: 7px 13px;
      font-size: 13px;
      border-radius: 8px;
      background: #e5e5e5;
      color: #444;
    }

    .tab.active {
      background: #222;
      color: white;
    }

    .tab-content {
      display: none;
    }

    .tab-content.active {
      display: block;
    }

    .duration-options {
      display: flex;
      gap: 8px;
      margin-bottom: 15px;
    }

    .duration-option {
      flex: 1;
      padding: 12px 5px;
      background: #e5e5e5;
      color: #222;
      border-radius: 9px;
      font-size: 16px;
    }

    .duration-option.active {
      background: #222;
      color: white;
    }

    /* Custom duration picker */
    .custom-picker-label {
      text-align: center;
      color: #666;
      font-size: 14px;
      margin-bottom: 5px;
    }
    
    .custom-duration-picker {
      position: relative;
      height: 150px;
      overflow: hidden;
      margin-bottom: 15px;
      border-radius: 10px;
      background: #f1f1f1;
    }
    
    .custom-duration-scroll {
      height: 150px;
      overflow-y: auto;
      overflow-x: hidden;
      scroll-snap-type: y mandatory;
      scrollbar-width: thin;
      scrollbar-color: #aaa transparent;
      padding: 60px 0;
    }
    
    .custom-duration-scroll::-webkit-scrollbar {
      width: 2px;
    }
    
    .custom-duration-scroll::-webkit-scrollbar-track {
      background: transparent;
    }
    
    .custom-duration-scroll::-webkit-scrollbar-thumb {
      background: #aaa;
      border-radius: 3px;
    }
    
    .custom-minute {
      display: block;
      width: 100%;
      height: 30px;
      padding: 4px;
      border: none;
      background: transparent;
      color: #999;
      font-size: 16px;
      scroll-snap-align: center;
      transition: all 0.15s;
    }
    
    .custom-minute.selected {
      background: #222;
      color: white;
      font-weight: bold;
      border-radius: 8px;
    }
    
    .custom-duration-picker::before,
    .custom-duration-picker::after {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      height: 55px;
      z-index: 2;
      pointer-events: none;
    }
    
    .custom-duration-picker::before {
      top: 0;
      background: linear-gradient(
        to bottom,
        #f1f1f1,
        rgba(241, 241, 241, 0)
      );
    }
    
    .custom-duration-picker::after {
      bottom: 0;
      background: linear-gradient(
        to top,
        #f1f1f1,
        rgba(241, 241, 241, 0)
      );
    }
    
    .last-completed {
      margin-top: 14px;
      text-align: center;
      color: #888;
      font-size: 13px;
    }

    .preview {
      background: #f1f1f1;
      border-radius: 10px;
      padding: 12px;
      text-align: center;
      margin-bottom: 15px;
      color: #444;
      line-height: 1.5;
    }

    label {
      display: block;
      font-weight: bold;
      margin-bottom: 6px;
    }

    input {
      width: 100%;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
      margin-bottom: 15px;
    }

    .error {
      color: #c62828;
      text-align: center;
      margin-top: 12px;
      font-weight: bold;
    }

    .loading {
      text-align: center;
      color: #666;
    }
  </style>

</head>

<body>

<div class="container">

  <div class="header">
    <div class="icon">🧺</div>
    <div id="status"></div>
  </div>

  <div id="app" class="card">
    <div class="loading">LOADING<br>Checking the washing machine...</div>
  </div>
  
  <div class="last-completed" id="lastCompleted"></div>

</div>

<script>
  const SUPABASE_URL = "https://qhqpclogoqrjugqzoubc.supabase.co";
  const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_ogf6g9WUClTrW06kaEX_Uw_smD5Dr3u";

  const { createClient } = supabase;
  const db = createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);

  const app = document.getElementById("app");

  let selectedDuration = 60;
  let countdownInterval = null;

  function formatDate(date) {
    return date.toLocaleString("de-CH", {
      day: "2-digit",
      month: "2-digit",
      hour: "2-digit",
      minute: "2-digit"
    });
  }

  function formatCountdown(milliseconds) {
    if (milliseconds <= 0) {
      return "00:00:00";
    }

    const totalSeconds = Math.floor(milliseconds / 1000);
    const hours = Math.floor(totalSeconds / 3600);
    const minutes = Math.floor((totalSeconds % 3600) / 60);
    const seconds = totalSeconds % 60;

    return [
      String(hours).padStart(2, "0"),
      String(minutes).padStart(2, "0"),
      String(seconds).padStart(2, "0")
    ].join(":");
  }

  async function loadMachine() {
    try {
      const { data, error } = await db.rpc("get_machine_status");

      if (error) throw error;

      const machine = data[0];

      if (
        machine &&
        machine.end_time &&
        new Date(machine.end_time).getTime() > Date.now()
      ) {
        showBusy(machine);
      } else {
        showFree(machine);
      }

    } catch (error) {
      console.error(error);

      app.innerHTML = `
        <div class="error">
          Could not load the washing machine status.<br>
          Please try again.
        </div>
      `;
    }
  }

  function showBusy(machine) {
    if (countdownInterval) {
      clearInterval(countdownInterval);
    }

    const start = new Date(machine.start_time);
    const end = new Date(machine.end_time);

    document.getElementById("status").innerHTML = `
      <div class="status busy">
        BESETZT / OCCUPIED
      </div>
    `;

    app.innerHTML = `
      <div class="info">
        <div class="info-row">
          <span class="info-label">Anfang / Start</span>
          <span class="info-time">${formatDate(start)}</span>
        </div>
    
        <div class="info-row">
          <span class="info-label">Ende / Finish</span>
          <span class="info-time">${formatDate(end)}</span>
        </div>
      </div>
    
      <div class="countdown" id="countdown">
        ${formatCountdown(end - Date.now())}
      </div>
    
      <button class="finish-button" id="finishButton">
        Ich bin fertig – Waschmaschine ist frei<br>
        I'm done – washing machine is free
      </button>
    `;

    document.getElementById("finishButton").addEventListener("click", finishWash);

    countdownInterval = setInterval(() => {
      const remaining = end.getTime() - Date.now();

      if (remaining <= 0) {
        clearInterval(countdownInterval);
        finishWash();
      } else {
        const countdown = document.getElementById("countdown");
        if (countdown) {
          countdown.textContent = formatCountdown(remaining);
        }
      }
    }, 1000);
  }

  function showFree(machine) {
    if (countdownInterval) {
      clearInterval(countdownInterval);
      countdownInterval = null;
    }

    document.getElementById("status").innerHTML = `
      <div class="status free">
        FREI / FREE
      </div>
    `;

    app.innerHTML = `
      <div class="tabs">
        <button class="tab active" id="durationTab">
          Dauer / Duration
        </button>

        <button class="tab" id="exactTab">
          Start / Ende
        </button>
      </div>

      <div id="durationContent" class="tab-content active">

        <div class="duration-options">
          <button class="duration-option" data-duration="40">
            40 min
          </button>

          <button class="duration-option active" data-duration="60">
            60 min
          </button>

          <button class="duration-option" data-duration="90">
            90 min
          </button>
        </div>

        <div class="custom-duration-picker">
          <div class="custom-duration-scroll" id="customDurationScroll">
            ${Array.from({ length: 180 }, (_, i) => {
              const minutes = i + 1;
              return `
                <button
                  class="custom-minute ${minutes === 60 ? "selected" : ""}"
                  data-minutes="${minutes}">
                  ${minutes} min
                </button>
              `;
            }).join("")}
          </div>
        </div>

        <div class="preview" id="durationPreview">
          Jetzt starten / Starts now<br>
          <strong id="durationEndPreview"></strong>
        </div>

        <button id="startDurationButton">
          Waschen beginnen – Start washing
        </button>

      </div>

      <div id="exactContent" class="tab-content">

        <label for="startTime">
          Start / Anfang
        </label>

        <input type="datetime-local" id="startTime">

        <label for="endTime">
          End / Ende
        </label>

        <input type="datetime-local" id="endTime">

        <button id="startExactButton">
          Waschen beginnen – Start washing
        </button>

      </div>

      <div id="errorMessage" class="error"></div>
    `;
    
    const lastCompleted = machine?.last_completed_at;

    if (lastCompleted) {
      document.getElementById("lastCompleted").textContent =
        `Letzte Wäsche / Last completed wash: ${formatDate(new Date(lastCompleted))}`;
    } else {
      document.getElementById("lastCompleted").textContent = "";
    }

    setupFreeControls();
    updateDurationPreview();

    // Scroll custom picker to 60 minutes initially
    const selected = document.querySelector(
      '.custom-minute[data-minutes="60"]'
    );

    if (selected) {
      selected.scrollIntoView({
        behavior: "instant",
        block: "nearest",
        inline: "center"
      });
    }
  }

  function setupFreeControls() {
    const durationTab = document.getElementById("durationTab");
    const exactTab = document.getElementById("exactTab");

    const durationContent = document.getElementById("durationContent");
    const exactContent = document.getElementById("exactContent");

    durationTab.addEventListener("click", () => {
      durationTab.classList.add("active");
      exactTab.classList.remove("active");

      durationContent.classList.add("active");
      exactContent.classList.remove("active");
    });

    exactTab.addEventListener("click", () => {
      exactTab.classList.add("active");
      durationTab.classList.remove("active");

      exactContent.classList.add("active");
      durationContent.classList.remove("active");

      setDefaultExactTimes();
    });

    // Preset durations
    document.querySelectorAll(".duration-option").forEach(button => {
      button.addEventListener("click", () => {
        selectedDuration = Number(button.dataset.duration);

        document.querySelectorAll(".duration-option").forEach(b => {
          b.classList.remove("active");
        });

        button.classList.add("active");

        document.querySelectorAll(".custom-minute").forEach(b => {
          b.classList.remove("selected");
        });

        updateDurationPreview();
      });
    });

    // Custom duration picker
    document.querySelectorAll(".custom-minute").forEach(button => {
      button.addEventListener("click", () => {
        selectedDuration = Number(button.dataset.minutes);

        document.querySelectorAll(".custom-minute").forEach(b => {
          b.classList.remove("selected");
        });

        button.classList.add("selected");

        document.querySelectorAll(".duration-option").forEach(b => {
          b.classList.remove("active");
        });

        updateDurationPreview();
      });
    });

    document.getElementById("startDurationButton")
      .addEventListener("click", startDurationWash);

    document.getElementById("startExactButton")
      .addEventListener("click", startExactWash);
  }

  function updateDurationPreview() {
    const now = new Date();

    const end = new Date(
      now.getTime() + selectedDuration * 60 * 1000
    );

    document.getElementById("durationEndPreview").textContent =
      `Ende / Ends: ${formatDate(end)} (${selectedDuration} min)`;
  }

  function setDefaultExactTimes() {
    const now = new Date();
    const end = new Date(now.getTime() + 60 * 60 * 1000);

    document.getElementById("startTime").value =
      toDatetimeLocal(now);

    document.getElementById("endTime").value =
      toDatetimeLocal(end);
  }

  function toDatetimeLocal(date) {
    const year = date.getFullYear();
    const month = String(date.getMonth() + 1).padStart(2, "0");
    const day = String(date.getDate()).padStart(2, "0");
    const hours = String(date.getHours()).padStart(2, "0");
    const minutes = String(date.getMinutes()).padStart(2, "0");

    return `${year}-${month}-${day}T${hours}:${minutes}`;
  }

  async function startDurationWash() {
    const errorMessage = document.getElementById("errorMessage");
    errorMessage.textContent = "";

    const minutes = selectedDuration;

    if (!minutes || minutes <= 0 || minutes > 180) {
      errorMessage.textContent =
        "Please select a duration between 1 and 180 minutes.";
      return;
    }

    const start = new Date();

    const end = new Date(
      start.getTime() + minutes * 60 * 1000
    );

    await saveWash(start, end);
  }

  async function startExactWash() {
    const errorMessage = document.getElementById("errorMessage");
    errorMessage.textContent = "";

    const startValue = document.getElementById("startTime").value;
    const endValue = document.getElementById("endTime").value;

    if (!startValue || !endValue) {
      errorMessage.textContent =
        "Please enter both start and finish times.";
      return;
    }

    const start = new Date(startValue);
    const end = new Date(endValue);

    await saveWash(start, end);
  }

  async function saveWash(start, end) {
    const errorMessage = document.getElementById("errorMessage");

    if (end <= start) {
      errorMessage.textContent =
        "Finish time must be after start time.";
      return;
    }

    if (start < new Date(Date.now() - 10 * 60 * 1000)) {
      errorMessage.textContent =
        "Start time is too far in the past.";
      return;
    }

    if (end > new Date(Date.now() + 24 * 60 * 60 * 1000)) {
      errorMessage.textContent =
        "Finish time cannot be more than 24 hours from now.";
      return;
    }

    const button = document.querySelector(
      "#startDurationButton, #startExactButton"
    );

    if (button) {
      button.disabled = true;
    }

    const { error } = await db.rpc("start_wash", {
      p_start_time: start.toISOString(),
      p_end_time: end.toISOString()
    });

    if (error) {
      console.error(error);

      errorMessage.textContent =
        error.message || "Could not start the washing machine.";

      if (button) {
        button.disabled = false;
      }

      return;
    }

    loadMachine();
  }

  async function finishWash() {
    const button = document.getElementById("finishButton");

    if (button) {
      button.disabled = true;
    }

    const { error } = await db.rpc("finish_wash");

    if (error) {
      console.error(error);

      if (button) {
        button.disabled = false;
      }

      alert("Could not finish the wash. Please try again.");
      return;
    }

    loadMachine();
  }

  loadMachine();

  // Refresh status every 30 seconds
  setInterval(loadMachine, 30000);
</script>

</body>
</html>
